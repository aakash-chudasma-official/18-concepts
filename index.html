ustrations, not reported findings from the cited","research."],["•","This is a research-informed educational draft. Before publication,","verify citations, review each claim, and expand the evidence","discussion."],["M E N TA L M O D E L 1 8 / 1 8 18 Law Of Diminishing Returns","One of eighteen ideas to understand choices, behavior, and everyday","life."],["Know When More Stops Helping as Much","Evidence note: Explain diminishing marginal product with fixed","inputs; distinguish it from fatigue, diminishing utility, and","eventual negative returns.","Introduction","This short book explains law of diminishing returns using practical","decisions, simple examples, and exercises. The goal is","understanding, not promising perfect outcomes. All named people","and illustrative businesses in the examples are fictional.","How to Use This Book","Read one chapter at a time. Complete its reflection task before","moving on. Test your knowledge at the end, then revisit ideas after a","few days. A high quiz score demonstrates understanding of these","questions, not scientific measurement of character or future success.","Chapter 1: The Extra Hour Question","A student studies productively for the first hour, learns moderately","well in the second, then gains almost nothing from reading the same","page while exhausted. This resembles diminishing benefit, but it is","not proof of the formal economic law. Sleep, motivation and study","method complicate the picture."],["The law of diminishing marginal returns has a specific economic","meaning: when additional units of a variable input are added while","other relevant inputs remain fixed, the extra output eventually tends","to decline.","Practical reflection: Write two situations where adding “more”","seems to help less over time.","Key takeaway: The law of diminishing marginal returns has a","specific economic meaning: when additional units of a variable input","are added while other relevant inputs remain fixed, the extra output","eventually tends to decline.","Chapter 2: Total Output Versus Extra Output","A small bakery has one oven. The first worker bakes many loaves. A","second worker helps with preparation and cleanup. After enough","workers are added, however, crowding around the single oven makes","each additional worker contribute fewer extra loaves.","Total production can still rise while marginal production—the output","from one extra worker—falls. Diminishing marginal returns does not","automatically mean total output decreases. It also does not say the","first extra worker must have lower productivity.","Practical reflection: Sketch total loaves and extra loaves produced","as workers are added.","Key takeaway: Total production can still rise while marginal","production—the output from one extra worker—falls."],["Chapter 3: Why Fixed Constraints Matter","The oven is fixed in the bakery example. Adding a second oven","changes the conditions and may improve productivity. Technology,","training, workflow design and available space can shift the point at","which diminishing returns appear.","That is why the law is most clearly framed for a short-run production","setting with at least one fixed input. Applying it to every part of life","as an absolute rule loses important context.","Practical reflection: Identify the fixed constraint in a work process","you know.","Key takeaway: That is why the law is most clearly framed for a","short-run production setting with at least one fixed input.","Chapter 4: Daily-Life Analogies","Adding more advertising budget to a tiny target audience may","eventually buy increasingly expensive results, but actual outcomes","depend on market dynamics. Adding more revision time may yield","less benefit near an exam after core material is mastered. These are","analogies, not automatic economic laws.","The helpful question is: what extra improvement comes from the","next unit of time or money? Look at marginal benefit and marginal","cost together. If the next hour costs more than it is likely to deliver,","consider an alternative.","Practical reflection: Compare the next hour spent on two different","tasks and state expected value in plain terms."],["Key takeaway: The helpful question is: what extra improvement","comes from the next unit of time or money? Look at marginal benefit","and marginal cost together.","Chapter 5: Diminishing Does Not Mean Negative","Imagine output rises from 10 to 22, then to 31, then 37. Extra gains","are 12, 9 and 6. Production keeps growing, but by smaller","increments. Negative marginal output would be a different situation,","where an extra input reduces total output.","Also distinguish diminishing marginal utility, which concerns the","additional satisfaction from consuming another unit, from diminishing","marginal product, which concerns production. They are related","economic patterns, not interchangeable labels.","Practical reflection: Calculate the extra gain between 5, 14, 21 and","26 units of output.","Key takeaway: Also distinguish diminishing marginal utility, which","concerns the additional satisfaction from consuming another unit,","from diminishing marginal product, which concerns production.","Chapter 6: Smarter Allocation","A founder polishing a logo for the twentieth hour may gain less than","using that hour to speak with customers. The correct decision","depends on goals, deadlines and quality thresholds, not a universal","“stop at hour three” rule."],["Create a stop-or-switch checkpoint: what is the next unit of work","expected to change? What else could that time achieve? When does","quality become good enough for the current stage?","Practical reflection: Choose one task and define a measurable","checkpoint for reassessment.","Key takeaway: Create a stop-or-switch checkpoint: what is the next","unit of work expected to change? What else could that time achieve?","When does quality become good enough for the current stage?.","Chapter 7: Seven-Day Marginal Benefit Audit","Day 1 pick a repeated input: hours, money or effort. Day 2 record","baseline output. Day 3 add a unit and measure extra benefit. Day 4","repeat if safe. Day 5 identify fixed constraints. Day 6 compare","alternative uses. Day 7 revise your allocation.","The principle teaches allocation, not laziness. Doing more may still be","worth it, even if each additional unit helps less. The decision turns on","additional benefit, additional cost and your priorities.","Practical reflection: Write one rule for deciding when to continue,","improve the system or switch tasks.","Key takeaway: The principle teaches allocation, not laziness.","Knowledge Check — 10 Questions","Each correct answer is worth 10 points. Maximum score: 100/100.","Do not use completion percentage as a substitute for knowledge."],["1. Diminishing marginal returns concerns?","•","A. Extra output from additional variable input","•","B. Total output always falling","•","C. Income tax only","•","D. A guaranteed business failure","2. What does marginal output mean?","•","A. Output added by one more input unit","•","B. Total annual income","•","C. Average age","•","D. Last year profit","3. Can total output rise as marginal returns diminish?","•","A. Yes","•","B. No","•","C. Only online","•","D. Only with no workers","4. What is fixed in the bakery example?","•","A. Oven capacity","•","B. Number of ideas","•","C. Weather","•","D. Bread price always","5. What can change the returns pattern?","•","A. Adding equipment or improving workflow"],["•","B. Repeating a slogan","•","C. Ignoring constraints","•","D. Using less data","6. What is distinct from marginal product?","•","A. Marginal utility","•","B. Extra output","•","C. Worker contribution","•","D. Added production","7. Which series shows diminishing marginal gains?","•","A. +10,+7,+3","•","B. +2,+5,+9","•","C. +4,+4,+4","•","D. +3,+8,+8","8. What should guide whether to continue work?","•","A. Marginal benefit versus marginal cost","•","B. Only the total spent","•","C. Personal pride alone","•","D. A universal time limit","9. Are life examples exact applications of the production law?","•","A. Not necessarily; often analogies","•","B. Always","•","C. Only if positive","•","D. Only with salaries"],["10. Does diminishing returns mean stop immediately?","•","A. No, extra benefit may still exceed cost","•","B. Always","•","C. Only on Monday","•","D. Only if tired","Answer Key","1.","A — It is about marginal product with other inputs fixed.","2.","A — Marginal means additional.","3.","A — It can rise by smaller amounts.","4.","A — The oven is a limiting input.","5.","A — Changing fixed capacity shifts production possibilities.","6.","A — Utility concerns additional satisfaction.","7.","A — The increments get smaller.","8.","A — Future incremental value matters.","9.","A — Conditions differ across contexts.","10.","A — A smaller additional benefit can remain worthwhile.","Reference and Further Reading","•","Primary starting source: https://openstax.org/books/principles-","microeconomics-3e/pages/7-2-production-in-the-short-run","•","Examples and exercises in this manuscript are original","instructional illustrations, not reported findings from the cited","research."],["•","This is a research-informed educational draft. Before publication,","verify citations, review each claim, and expand the evidence","discussion."]];
const sections=[{"name":"The Compound Effect","start":4,"end":25},{"name":"Opportunity Cost","start":26,"end":38},{"name":"Lifestyle Creep","start":39,"end":51},{"name":"Second-Order Thinking","start":52,"end":64},{"name":"First Principles Thinking","start":65,"end":76},{"name":"Imposter Syndrome","start":77,"end":88},{"name":"Inversion Principle","start":89,"end":100},{"name":"Loss Aversion","start":101,"end":112},{"name":"Status Signaling","start":113,"end":120},{"name":"Parkinson's Law of Money","start":121,"end":128},{"name":"Delayed Gratification","start":129,"end":136},{"name":"Cognitive Reframing","start":137,"end":144},{"name":"Locus of Control","start":145,"end":154},{"name":"Mental Clarity Deficit","start":155,"end":164},{"name":"Asymmetric Upside","start":165,"end":174},{"name":"Zero-Sum Game","start":175,"end":184},{"name":"Signal vs. Noise","start":185,"end":194},{"name":"Law of Diminishing Returns","start":195,"end":204}];


const $=s=>document.querySelector(s);
const safe=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const headings=/^(Chapter\s+\d+\s*[—–-]|Knowledge Assessment|References and further reading|Further Reading and References|Answer key|Answer Key|Glossary|Editorial note|Quick summary|What you will learn|Your reading roadmap|BEFORE YOU BEGIN)/i;
const subheads=/^(\d+\.\d+\s+|Step\s+\d+\s*[:—–-]|Mistake\s+\d+\s*[:—–-]|Personal worksheet|Real-world scenario|Five takeaways|Summary:|What you will learn:|One-minute check-in:|Key takeaway:)/i;
const question=/^(?:Q(?:uestion)?\s*\d+[\.:]|[A-D]\.\s)/i;
const conceptStarts=sections.map(s=>s.start);
function clean(t){return String(t||"").replace(/\s+/g," ").trim()}
function joinLines(lines){
 let out=[],buffer="";
 const flush=()=>{if(buffer.trim())out.push({type:"p",text:buffer.trim()});buffer=""};
 for(let i=0;i<lines.length;i++){
  let line=clean(lines[i]);if(!line)continue;
  if(/^\d{1,3}$/.test(line))continue;
  if(/^[•]\s*$/.test(line)){flush();continue}
  let heading=headings.test(line)&&line.length<130;
  let sub=subheads.test(line)&&line.length<155;
  let isQuestion=question.test(line)&&line.length<260;
  let list=/^[•-]\s+/.test(line)||/^\d{1,2}\.\s+[A-Za-z]/.test(line);
  if(heading||sub||isQuestion||list){
   flush();out.push({type:heading?"h2":sub?"h3":isQuestion?"option":"list",text:line});continue
  }
  if(buffer){
   if(/[-–]$/.test(buffer)&&/[\p{L}]/u.test(line[0]||""))buffer=buffer.slice(0,-1)+line;
   else buffer+=" "+line;
  }else buffer=line;
  if(/[.!?]$/.test(line)&&buffer.length>240)flush();
 }
 flush();return out;
}
function allChapters(){
 const result=[];let introLines=pages.slice(3,sections[0].start).flat();
 result.push({key:"intro",book:0,title:"Introduction",blocks:joinLines(introLines)});
 sections.forEach((sec,i)=>{
  let lines=pages.slice(sec.start,sec.end+1).flat().map(clean).filter(Boolean);
  let chapters=[],cur={key:"b"+(i+1)+"-overview",book:i+1,title:"Overview",lines:[]};
  const commit=()=>{if(cur.lines.length)chapters.push({...cur,blocks:joinLines(cur.lines)})};
  for(let j=0;j<lines.length;j++){
    const line=lines[j];
    if(/^Chapter\s+\d+\s*[—–-]/i.test(line)){
     commit();const num=(line.match(/^Chapter\s+(\d+)/i)||[])[1]||"";
     let title=line.replace(/^Chapter\s+\d+\s*[—–-]\s*/i,"");
     let k=j+1;
     while(k<lines.length&&title.length<65&&!/[.!?]$/.test(title)&&!/^(\d+\.\d+|Chapter|Knowledge Assessment)/i.test(lines[k])&&k<=j+2){
       title+=" "+lines[k];k++;
     }
     j=k-1;
     cur={key:"b"+(i+1)+"-ch"+num,book:i+1,title:"Chapter "+num+": "+title,lines:[]};continue;
    }
    if(/^Knowledge Assessment\b/i.test(line)&&cur.key.indexOf("assessment")<0){
     commit();cur={key:"b"+(i+1)+"-assessment",book:i+1,title:"Knowledge Assessment & References",lines:[]};
    }
    cur.lines.push(line);
  }
  commit();
  if(chapters.length===0)chapters.push({key:"b"+(i+1),book:i+1,title:sec.name,blocks:joinLines(lines)});
  result.push(...chapters);
 });
 return result;
}
const book=allChapters();
const storageKey="concepts-reader-v3";
let settings={current:0,font:18,theme:"light",completed:[],bookmarks:[]};
try{Object.assign(settings,JSON.parse(localStorage.getItem(storageKey)||"{}"))}catch{}
settings.current=Math.max(0,Math.min(book.length-1,settings.current|0));
function save(){localStorage.setItem(storageKey,JSON.stringify(settings))}
const byBook=i=>book.map((x,j)=>({...x,idx:j})).filter(x=>x.book===i);
function sidebar(){
 const q=$("#toc-search").value.trim().toLowerCase();
 $("#chapters").innerHTML='<button class="side-item '+(settings.current===0?"selected":"")+'" data-chapter="0"><span>✦</span> Introduction</button>'+
 sections.map((sec,i)=>{
  const units=byBook(i+1);
  const match=sec.name.toLowerCase().includes(q)||units.some(u=>u.title.toLowerCase().includes(q)||u.blocks.some(b=>b.text.toLowerCase().includes(q)));
  if(q&&!match)return "";
  let active=book[settings.current].book===i+1;
  return '<div class="section-label"><span>'+String(i+1).padStart(2,"0")+'</span> '+safe(sec.name)+'</div>'+
  units.map(u=>'<button class="side-item '+(settings.current===u.idx?"selected":"")+'" data-chapter="'+u.idx+'"><span>'+(settings.completed.includes(u.key)?"✓":"◦")+'</span>'+safe(u.title)+'</button>').join("");
 }).join("");
 $("#toccount").textContent=settings.completed.length+" / "+book.length+" sections read";
 const list=$("#chapters");
 list.querySelectorAll("[data-chapter]").forEach(b=>b.onclick=()=>navigate(+b.dataset.chapter));
}
function renderBlocks(blocks){
 return blocks.map(b=>{
  const t=safe(b.text);
  if(b.type==="h2")return "<h2>"+t+"</h2>";
  if(b.type==="h3")return "<h3>"+t+"</h3>";
  if(b.type==="option")return '<p class="question-line">'+t+"</p>";
  if(b.type==="list")return '<p class="list-line">'+t+"</p>";
  if(/^(Key takeaway:|One-minute check-in:|Chapter checkpoint:|Reflection:|Editorial note:)/i.test(b.text))return '<p class="insight">'+t+"</p>";
  return "<p>"+t+"</p>"
 }).join("");
}
function render(){
 let c=book[settings.current];
 document.documentElement.style.setProperty("--reader-font",settings.font+"px");
 document.body.classList.toggle("dark",settings.theme==="dark");
 $("#model-label").textContent=c.book?"MENTAL MODEL "+String(c.book).padStart(2,"0")+" / 18":"WELCOME TO THE LIBRARY";
 $("#chapter-title").textContent=c.title;
 $("#model-title").textContent=c.book?sections[c.book-1].name:"18 Concepts Everyone Should Know";
 $("#reading-body").innerHTML=renderBlocks(c.blocks);
 $("#counter").textContent=(settings.current+1)+" / "+book.length+" sections";
 $("#prev").disabled=settings.current===0;$("#next").disabled=settings.current===book.length-1;
 $("#progress-fill").style.width=(settings.completed.length/book.length*100)+"%";
 $("#progress-text").textContent=Math.round(settings.completed.length/book.length*100)+"% completed";
 $("#markread").textContent=settings.completed.includes(c.key)?"✓ Completed":"Mark complete";
 $("#bookmark").textContent=settings.bookmarks.includes(c.key)?"★ Bookmarked":"☆ Bookmark";
 sidebar();save();window.scrollTo({top:0,behavior:"instant"});
}
function navigate(n){settings.current=Math.max(0,Math.min(book.length-1,n));$("#sidebar").classList.remove("open");render()}
$("#prev").onclick=()=>navigate(settings.current-1);
$("#next").onclick=()=>navigate(settings.current+1);
$("#markread").onclick=()=>{const k=book[settings.current].key;if(settings.completed.includes(k))settings.completed=settings.completed.filter(x=>x!==k);else settings.completed.push(k);render()};
$("#bookmark").onclick=()=>{const k=book[settings.current].key;if(settings.bookmarks.includes(k))settings.bookmarks=settings.bookmarks.filter(x=>x!==k);else settings.bookmarks.push(k);render()};
$("#decrease").onclick=()=>{settings.font=Math.max(14,settings.font-2);render()};
$("#increase").onclick=()=>{settings.font=Math.min(28,settings.font+2);render()};
$("#theme").onclick=()=>{settings.theme=settings.theme==="light"?"dark":"light";render()};
$("#mobile-menu").onclick=()=>$("#sidebar").classList.toggle("open");
$("#close-menu").onclick=()=>$("#sidebar").classList.remove("open");
$("#toc-search").oninput=sidebar;
let touchStartX=0,touchStartY=0;
$("#paper").addEventListener("touchstart",e=>{touchStartX=e.changedTouches[0].clientX;touchStartY=e.changedTouches[0].clientY},{passive:true});
$("#paper").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;if(Math.abs(dx)>95&&Math.abs(dx)>Math.abs(dy)*1.5)navigate(settings.current+(dx<0?1:-1))},{passive:true});
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))return;if(e.key==="ArrowRight")navigate(settings.current+1);if(e.key==="ArrowLeft")navigate(settings.current-1)});
render();
